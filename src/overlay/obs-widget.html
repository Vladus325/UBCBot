<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px 60% 0 0;
    font-family: Arial, sans-serif;
    color: white;
    background: transparent;
}

.container {
    width: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;

    transform: translateY(50px);
    opacity: 0;
    transition: 0.5s ease;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.container.show {
    transform: translateY(0);
    opacity: 1;
}

.title {
    font-size: 16px;
    font-weight: bold;
    margin: 0;
    word-wrap: break-word;
    word-break: break-word;
    overflow-wrap: break-word;
    line-height: 1.4;
    max-width: 95%;
}

.user {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 8px;
}

.progress {
    width: 100%;
    height: 6px;
    background: rgba(0, 0, 0, 0.3);
    margin-top: 12px;
    border-radius: 3px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: linear-gradient(90deg, rgba(82,12,115,1) 0%, rgba(50,0,102,1) 100%);
    width: 0%;
    transition: width 0.1s linear;
}

.bar.paused {
    background: linear-gradient(90deg, rgba(128,128,128,1) 0%, rgba(96,96,96,1) 100%);
}
</style>
</head>
<body>

<div class="container" id="container">
    <div class="title" id="title">Нет трека</div>
    <div class="user" id="user"></div>
    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>
</div>

<audio id="player"></audio>

<script>
const player = document.getElementById('player');
const container = document.getElementById('container');

let currentTrackId = null;
let last = null;
let lastFetchAt = 0;
let resyncing = false;

// Автопереход только по этому событию: сервер сам решает, пора ли
// (trackId + дебаунс на его стороне), так что двойных скипов нет
player.addEventListener('ended', () => {
  if (!currentTrackId) return;
  fetch('/api/track-ended', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ trackId: currentTrackId })
  }).catch(err => console.error('Ошибка track-ended:', err));
});

player.addEventListener('error', (e) => {
  console.error('Ошибка аудио:', e);
  // Например, 404 от /audio в момент смены трека: сбросим trackId,
  // чтобы следующий опрос подставил src заново, а не молчал до ручного
  // обновления источника
  if (currentTrackId && player.getAttribute('src')) {
    currentTrackId = null;
  }
});

// Синхронизирует позицию плеера с серверерным таймером: после перезагрузки
// overlay, паузы или рассинхрона звук продолжает с правильного места
function resyncToServer() {
  if (!last || !Number.isFinite(last.elapsed) || resyncing) return;
  const target = last.elapsed;
  if (Math.abs(player.currentTime - target) > 2.5 && Number.isFinite(player.duration)) {
    resyncing = true;
    try { player.currentTime = target; } catch (err) { /* seek до готовности */ }
    setTimeout(() => { resyncing = false; }, 500);
  }
}

player.addEventListener('loadedmetadata', resyncToServer);

function renderState(data) {
  if (!data) return;
  last = data;
  lastFetchAt = Date.now();
  document.getElementById('title').innerText = data.title || 'Нет трека';
  document.getElementById('user').innerText = data.requestedBy ? `Запрошено: ${data.requestedBy}` : '';
}

async function update() {
  try {
    const res = await fetch('/api/now');
    const data = await res.json();
    if (!data || !data.trackId) {
      if (currentTrackId !== null && (!data || !data.trackId)) {
        // трек закончился и очередь пуста
        currentTrackId = null;
        last = null;
        container.classList.remove('show');
        player.pause();
        player.removeAttribute('src');
        player.load();
      }
      return;
    }

    renderState(data);

    if (data.trackId !== currentTrackId) {
      currentTrackId = data.trackId;
      player.pause();
      player.src = '/audio?' + Date.now();
      player.volume = 1;
      player.load();
      player.play().catch(err => console.log('Autoplay blocked:', err));
      container.classList.add('show');
    } else if (data.isPaused) {
      if (!player.paused) player.pause();
    } else {
      resyncToServer();
      if (player.paused && player.src) {
        player.play().catch(err => console.log('Play blocked:', err));
      }
    }
  } catch (e) {
    console.error('Ошибка overlay:', e);
  }
}

function animate() {
  if (last && last.duration > 0) {
    const playing = !last.isPaused;
    // локальная интерполяция между опросами сервера
    const elapsed = last.isPaused ? last.elapsed : last.elapsed + (Date.now() - lastFetchAt) / 1000;
    const percent = Math.min((elapsed / last.duration) * 100, 100);
    document.getElementById('bar').style.width = percent + '%';
    document.getElementById('bar').classList.toggle('paused', !playing);
  }
  requestAnimationFrame(animate);
}

// Подключаемся к SSE для realtime обновлений
function setupSSE() {
  try {
    const eventSource = new EventSource('/api/events');

    eventSource.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);

        if (data.type === 'skip') {
          currentTrackId = null;
          last = null;
          container.classList.remove('show');
          player.pause();
          player.removeAttribute('src');
          player.load();
        } else if (data.type === 'pause') {
          player.pause();
        } else if (data.type === 'play') {
          update();
        } else if (data.type === 'trackStart' || data.trackId) {
          update();
        }
      } catch (err) {
        console.error('SSE parse error:', err);
      }
    };

    eventSource.onerror = () => {};

  } catch (err) {
    console.error('SSE setup error:', err);
  }
}

setupSSE();
setInterval(update, 1000);
update();
animate();
</script>

</body>
</html>
